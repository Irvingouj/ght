[package]
name = "ght"
version = "0.1.0"
edition = "2024"
description = "Your open GitHub pull requests, review threads and diffs in the terminal, with vim keys"
license = "MIT"
repository = "https://github.com/Irvingouj/ght"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.2"
ureq = { version = "2", features = ["json"] }
